name: Production Deployment

on:
  push:
    tags:
      - "**" # Triggers only on version tags, e.g., v1.0.0

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/test.yaml

  security:
    name: (CodeQL) Security Analysis
    uses: ./.github/workflows/codeql-security-analysis.yaml
    secrets: inherit
    permissions:
      contents: read
      security-events: write
      packages: read

  dependency-checks:
    name: Dependency Checks (npm audit)
    uses: ./.github/workflows/dependency-checks.yaml

  docker:
    needs: [test, security, dependency-checks]
    uses: ./.github/workflows/docker.yaml
    secrets: inherit

  deploy:
    name: Deploy to EC2
    needs: docker
    uses: ./.github/workflows/deploy.yaml
    secrets: inherit

  notify_prod:
    name: Notify Production Deployment
    needs: deploy
    uses: ./.github/workflows/notify_prod.yaml
    secrets: inherit
