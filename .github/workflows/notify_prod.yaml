name: Notify team of Production Deployment

on:
  workflow_call:

jobs:
  notify_prod:
    name: Notify Production Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Send Pipeline Email to Team
        env:
          TEAM_EMAILS: ${{ secrets.TEAM_EMAILS }}
          BREVO_USER: ${{ secrets.BREVO_SMTP_USER }}
          BREVO_PASS: ${{ secrets.BREVO_SMTP_PASSWORD }}
          REPO_NAME: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          # 1. Loop through team emails separated by spaces
          for EMAIL in $TEAM_EMAILS; do
            echo "Sending email to $EMAIL..."

            # 2. Create the personalized message using an unquoted heredoc (EOF) 
            # so the Bash variables inside it get evaluated properly.
            cat <<EOF > message.txt
          From: Pipeline Bot <mohamed.fouad.softwareengineer@gmail.com>
          To: $EMAIL
          Subject: New Version Deployed to Production for $REPO_NAME
          MIME-Version: 1.0
          Content-Type: text/html; charset=UTF-8

          <div style="font-family: Arial, sans-serif; background-color: #000000; color: #ffffff; padding: 40px 20px; text-align: center;">
              <div style="max-width: 500px; margin: auto; border: 1px solid #333333; border-radius: 12px; padding: 30px; background-color: #0a0a0a;">
              
              <p style="font-size: 16px; color: #cccccc; line-height: 1.5;">
                  <b style="color: #ffffff;">$ACTOR</b> has pushed to the <span style="color: #00ffcc;">$REF_NAME</span> branch in <b style="color: #ffffff;">$REPO_NAME</b>.
              </p>
              
              <p style="font-size: 18px; color: #00ffcc; font-weight: bold;">
                  The new version ($REF_NAME) has been successfully deployed to Production!
              </p>
              
              <div style="margin: 25px 0; padding: 15px; border-left: 3px solid #00ffcc; background-color: #111111; text-align: left;">
                  <p style="margin: 0; font-size: 12px; color: #888888; text-transform: uppercase; letter-spacing: 1px;">Commit Message:</p>
                  <p style="margin: 5px 0 0 0; font-family: monospace; color: #ffffff;">$COMMIT_MSG</p>
              </div>

              <div style="margin-top: 30px;">
                  <a href="$COMMIT_URL" style="display: inline-block; background-color: transparent; color: #00ffcc; border: 1px solid #00ffcc; padding: 12px 24px; text-decoration: none; border-radius: 30px; font-size: 14px; font-weight: bold;">View the code changes here</a>
              </div>
              </div>
          </div>
          EOF

            # 3. Send the email via Brevo
            curl --ssl-reqd \
              --silent \
              --show-error \
              --url "smtps://smtp-relay.brevo.com:465" \
              --user "$BREVO_USER:$BREVO_PASS" \
              --mail-from "mf2976527@gmail.com" \
              --mail-rcpt "$EMAIL" \
              --upload-file message.txt

          done
